<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Noria</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0b0e14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Noria" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=2" />
  <link rel="icon" href="/assets/icon-192.png?v=2" type="image/png" />
  <link rel="stylesheet" href="styles.css?v=4" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><a class="backchat" href="/workspace.html" title="Back to chat" aria-label="Back to chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a><svg class="brand-logo" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="nstar" x1="3" y1="21" x2="21" y2="3" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1f6ff0"/><stop offset=".5" stop-color="#7d5ccf"/><stop offset="1" stop-color="#f5920b"/></linearGradient></defs><path fill="url(#nstar)" d="M12 0c.7 6.3 5.7 11.3 12 12-6.3.7-11.3 5.7-12 12-.7-6.3-5.7-11.3-12-12C6.3 11.3 11.3 6.3 12 0Z"/></svg> <span>Noria</span></div>
      <div class="status" id="status">connecting to brain…</div>
    </header>

    <main class="stage">
      <div class="face-wrap">
        <canvas id="face"></canvas>
        <div class="statechip" id="statechip">idle</div>
        <div class="listening" id="listening">
          <div class="live-transcript" id="liveTranscript"></div>
          <div class="listen-row">
            <div class="wave" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
            <span class="listen-hint">Listening — tap to stop</span>
          </div>
        </div>
      </div>
      <video id="cam" playsinline muted hidden></video>
      <!-- AR: the room camera, shown behind the transparent Noria cutout -->
      <video id="arbg" playsinline muted></video>
      <!-- Presence mode: life-size Noria with spoken captions + a minimal bar -->
      <div class="caption" id="caption"></div>
      <div class="presence-bar" id="presenceBar">
        <button id="pTalk" class="pbtn primary" type="button">Talk to me</button>
        <button id="pAR" class="pbtn" type="button">In your room</button>
        <button id="pExit" class="pbtn" type="button">Exit</button>
      </div>
      <!-- Always-visible escape from Presence / AR (in case the bottom bar is covered) -->
      <button id="pClose" class="pclose" type="button" aria-label="Exit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </main>

    <section class="transcript" id="transcript" aria-live="polite"></section>

    <footer class="controls">
      <div class="composer">
        <input id="text" type="text" placeholder="Ask Noria" autocomplete="off" />
        <button id="mic" class="cbtn" type="button" title="Speak to Noria" aria-label="Voice input">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5 10.5a7 7 0 0 0 14 0"/><path d="M12 17.5v3.5"/></svg>
        </button>
        <button id="talk" class="cbtn" type="button" title="Live voice conversation — tap Noria to interrupt" aria-label="Live voice">
          <svg class="ico-wave" viewBox="0 0 24 24" fill="currentColor"><rect x="3.6" y="9" width="2.3" height="6" rx="1.15"/><rect x="8" y="5.5" width="2.3" height="13" rx="1.15"/><rect x="12.4" y="8" width="2.3" height="8" rx="1.15"/><rect x="16.8" y="10.5" width="2.3" height="3" rx="1.15"/></svg>
          <svg class="ico-stop" viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2.5"/></svg>
        </button>
        <button id="send" class="send" type="button" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V5"/><path d="M6 11l6-6 6 6"/></svg>
        </button>
      </div>
      <div class="opts">
        <div class="variant-toggle" id="variantToggle" role="tablist" aria-label="Choose Noria">
          <button class="vseg on" data-v="F" type="button" role="tab" aria-selected="true">Noria F</button>
          <button class="vseg" data-v="M" type="button" role="tab" aria-selected="false">Noria M</button>
        </div>
        <label class="seg" title="Noria's gaze follows your cursor / face"><input type="checkbox" id="vision" /> Vision</label>
        <button id="presence" class="seg" type="button" title="Full-screen presence — life-size Noria"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg> Presence</button>
        <button id="ar" class="seg" type="button" title="Place Noria in your real room (uses your camera)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h1.7l1-1.6A1 1 0 0 1 10 5h4a1 1 0 0 1 .85.4l1 1.6h1.65A1.5 1.5 0 0 1 20 8.5v9A1.5 1.5 0 0 1 18.5 19h-13A1.5 1.5 0 0 1 4 17.5z"/><circle cx="12" cy="12.5" r="3"/></svg> In your room</button>
        <button id="testvoice" class="seg" type="button" title="Play a quick voice test"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a9 9 0 0 1 0 12"/></svg> Test voice</button>
        <a id="facelink" class="seg" href="/verify.html" title="Optional on-device face verification (beta)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="9.5" rx="2.5"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg> Face verify</a>
        <button id="forget" class="seg forget" type="button" title="Clear what Noria remembers on this device">Forget me</button>
      </div>
    </footer>
  </div>
  <script type="module" src="app.js?v=8"></script>
</body>
</html>
