<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Virtual Noria</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><img class="brand-logo" src="assets/noria-logo-t.png" alt="Noria" /> Virtual Noria <span class="tag">Digital Human</span></div>
      <div class="status" id="status">connecting to brain…</div>
    </header>

    <main class="stage">
      <div class="face-wrap">
        <canvas id="face"></canvas>
        <div class="statechip" id="statechip">idle</div>
        <div class="listening" id="listening">
          <div class="mic-orb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></div>
          <div class="live-transcript" id="liveTranscript"></div>
          <div class="listen-hint">Listening… tap to stop</div>
        </div>
      </div>
      <video id="cam" playsinline muted hidden></video>
      <!-- AR: the room camera, shown behind the transparent Noria cutout -->
      <video id="arbg" playsinline muted></video>
      <!-- Presence mode: life-size Noria with spoken captions + a minimal bar -->
      <div class="caption" id="caption"></div>
      <div class="presence-bar" id="presenceBar">
        <button id="pTalk" class="pbtn primary" type="button">🎙 Talk to me</button>
        <button id="pAR" class="pbtn" type="button">📷 In your room</button>
        <button id="pExit" class="pbtn" type="button">✕ Exit</button>
      </div>
    </main>

    <section class="transcript" id="transcript" aria-live="polite"></section>

    <footer class="controls">
      <button id="mic" class="icon" title="Speak to Noria">🎙️</button>
      <input id="text" type="text" placeholder="Ask Noria anything…" autocomplete="off" />
      <button id="send" class="primary">Send</button>
      <button id="talk" type="button" title="Live voice conversation — tap Noria to interrupt">🎙 Talk</button>
      <div class="opts">
        <label class="seg"><input type="radio" name="variant" value="F" checked /> Noria-F</label>
        <label class="seg"><input type="radio" name="variant" value="M" /> Noria-M</label>
        <label class="seg" title="Noria's gaze follows your cursor / face"><input type="checkbox" id="vision" /> Vision</label>
        <button id="presence" class="seg" type="button" title="Full-screen presence — life-size Noria">⛶ Presence</button>
        <button id="ar" class="seg" type="button" title="Place Noria in your real room (uses your camera)">📷 In your room</button>
        <button id="testvoice" class="seg" type="button" title="Play a quick voice test">🔊 Test voice</button>
        <a id="facelink" class="seg" href="/verify.html" title="Optional on-device face verification (beta)">🔒 Face verify</a>
        <button id="forget" class="seg forget" type="button" title="Clear what Noria remembers on this device">Forget me</button>
      </div>
    </footer>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
