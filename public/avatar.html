<style>

  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{font-weight:800;letter-spacing:1px;font-size:14px;color:var(--accent);text-shadow:0 1px 12px rgba(212,175,55,.25)}

  .spacer{flex:1}

  .env button.on,.env button:hover{background:var(--accent);color:#000}
  .bottom{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
  .chat{width:min(440px,100%);max-height:44vh;background:var(--panel);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(16px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.6)}
  .history{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;min-height:60px}
  .msg{padding:9px 13px;border-radius:12px;font-size:14px;line-height:1.45;max-width:88%;animation:rise .25s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .msg.user{align-self:flex-end;background:rgba(212,175,55,.16);border:1px solid rgba(212,175,55,.3);color:var(--text)}
  .msg.noria{align-self:flex-start;background:rgba(255,255,255,.06);border:1px solid var(--line);color:#e7e9ee}
  .inbar{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:rgba(0,0,0,.28)}
  .inbar input{flex:1;min-width:0;background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:10px;padding:10px 13px;color:var(--text);font:inherit;font-size:14px;outline:none}
  .inbar input:focus{border-color:var(--accent)}
  .inbar button{flex:none;border:0;border-radius:10px;cursor:pointer;font:inherit;font-weight:700;color:#000;background:var(--accent);width:44px;display:inline-flex;align-items:center;justify-content:center}
  .inbar button.ghost{background:rgba(255,255,255,.08);color:#cfd3da}
  .inbar button.ghost.live{background:var(--accent);color:#000;animation:livePulse 1.8s ease-in-out infinite}
  @keyframes livePulse{0%,100%{box-shadow:0 0 0 0 rgba(212,175,55,.45)}50%{box-shadow:0 0 0 9px rgba(212,175,55,0)}}
  .inbar button svg{width:18px;height:18px}
  .status{font-size:12px;color:var(--text-2);min-height:15px;padding:0 4px}
  #loading{position:fixed;inset:0;z-index:10;background:#050508;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .6s}
  .spin{width:46px;height:46px;border:3px solid rgba(212,175,55,.12);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px}
  @keyframes spin{to{transform:rotate(360deg)}}
  #loading .t{font-size:13px;letter-spacing:4px;color:var(--accent);font-weight:600}
  .lstar{margin-bottom:16px;animation:lbreathe 1.8s ease-in-out infinite}
  @keyframes lbreathe{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.04)}}
  /* Focus toggle (top bar) — hide/show the chat so her face has full breathing room */
  .focusbtn{display:none;align-items:center;gap:6px;background:var(--panel);border:1px solid rgba(212,175,55,.2);color:var(--text);cursor:pointer;font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:20px;backdrop-filter:blur(12px)}
  .focusbtn svg{width:15px;height:15px}
  /* Bottom-sheet grab handle (mobile only) */
  .sheet-handle{display:none}
  @media (max-width:768px){
    .ui{padding:12px}
    .focusbtn{display:inline-flex}
    header{gap:8px}
    .brand{font-size:11px;order:3;width:100%}
    .env button{padding:6px 10px;font-size:11.5px}
    .bottom{gap:0}
    /* Chat becomes a semi-transparent floating bottom sheet */
    .chat{width:100%;max-height:44vh;max-height:44dvh;border-radius:20px 20px 0 0;background:rgba(10,10,16,.72)}
    .sheet-handle{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;width:100%;padding:8px 0 4px;background:transparent;border:0;cursor:pointer;color:var(--text-2)}

    .sheet-handle .lbl{font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;opacity:.7}

    .chat.min .history,.chat.min .status{display:none}
    .chat.min .sheet-handle .lbl::after{content:'Show chat'}
    .chat:not(.min) .sheet-handle .lbl::after{content:'Hide chat'}
    /* Focus mode: hide the whole chat sheet */
    body.focus .bottom{display:none}
  }
</style>

    onResult: () => {},
    onEnd: (text, err) => {

let audioUnlocked = false

// ── Mobile: bottom-sheet collapse + focus mode (keeps her 3D face unobstructed) ──
let viaVoice = false
const isMobile = () => window.matchMedia('(max-width:768px)').matches
$('sheetToggle').addEventListener('click', () => $('chat').classList.toggle('min'))
$('focusBtn').addEventListener('click', () => { const on = document.body.classList.toggle('focus'); $('focusLbl').textContent = on ? 'Show' : 'Focus' })
// When the user speaks to her (hands-free/watch mode) on a phone, collapse the

function autoCollapseForSpeech() { if (viaVoice && isMobile() && !document.body.classList.contains('focus')) $('chat').classList.add('min') }

// ── Load avatar ───────────────────────────────────────────────────────────────
const loader = new GLTFLoader()
const ktx2 = new KTX2Loader().setTranscoderPath('/vendor/three/examples/jsm/libs/basis/').detectSupport(renderer)
loader.setKTX2Loader(ktx2).setMeshoptDecoder(MeshoptDecoder)
loader.load(NORIA_GLB, (gltf) => {
  const root = gltf.scene; scene.add(root)
  root.traverse((o) => { if (o.isMesh && o.morphTargetDictionary) morphMeshes.push(o) })
  headObj = root.getObjectByName('Head') || morphMeshes[0] || root
  const box = new THREE.Box3().setFromObject(root), center = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3())
  const maxDim = Math.max(size.x, size.y, size.z), dist = (maxDim / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2))) * 1.25 * (matchMedia('(max-width:768px)').matches && innerHeight > innerWidth ? 1.35 : 1)
  camera.position.set(center.x, center.y + size.y * 0.04, center.z + dist)
  camera.near = dist / 50; camera.far = dist * 50; camera.updateProjectionMatrix(); camera.lookAt(center)
  key.position.set(center.x + maxDim, center.y + maxDim, center.z + maxDim * 2)
  $('loading').style.opacity = '0'; setTimeout(() => $('loading').remove(), 600)
}, undefined,
   () => { $('loadingText').textContent = 'PLEASE REFRESH' })

// ── Render loop ───────────────────────────────────────────────────────────────
const clock = new THREE.Clock()
function animate() {
  requestAnimationFrame(animate)
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime
  const gof = gestureOffset(dt)
  if (headObj) { headObj.rotation.y = Math.sin(t * 0.5) * 0.05; headObj.rotation.x = Math.sin(t * 0.37) * 0.025 + gof.x; headObj.rotation.z = gof.z }
  if (starsObj && starsObj.visible) starsObj.rotation.y += dt * 0.006
  updateBlink(t, dt)
  if (speaking && analyser) { analyser.getByteTimeDomainData(td); let s = 0; for (let i = 0; i < td.length; i++) { const v = (td[i] - 128) / 128; s += v * v } jawTarget = Math.min(1, Math.sqrt(s / td.length) * 3.6) } else jawTarget *= 0.8
  jaw += (jawTarget - jaw) * 0.45
  setMorph('jawOpen', jaw * 0.75)

  setMorph('mouthSmileLeft', emo.joy * 0.55); setMorph('mouthSmileRight', emo.joy * 0.55)
  setMorph('browInnerUp', emo.surprise * 0.8)
  if (hasMorph('eyeWideLeft')) { setMorph('eyeWideLeft', emo.surprise * 0.5); setMorph('eyeWideRight', emo.surprise * 0.5) }
  ;['eyeLookIn_L', 'eyeLookIn_R', 'eyeLookOut_L', 'eyeLookOut_R', 'eyeLookUp_L', 'eyeLookUp_R', 'eyeLookDown_L', 'eyeLookDown_R'].forEach((n) => setMorph(n, 0))
  if (!speaking && jaw < 0.02) { setMorph('mouthClose', 0.2); setMorph('jawOpen', 0) }
  renderer.render(scene, camera)
}
animate()
