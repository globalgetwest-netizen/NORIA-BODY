<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resetting Noria…</title>
<style>
  html,body{height:100%;margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#F7F5EF;color:#1A1712;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  .card{max-width:340px}
  .star{width:44px;height:44px;margin:0 auto 16px}
  h1{font-size:1.3rem;margin:0 0 8px}
  p{color:#7A7264;font-size:.95rem;line-height:1.5;margin:0}
  .ok{color:#3E9E6D;font-weight:600}
</style>
</head>
<body>
  <div class="card">
    <svg class="star" viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="s" x1="3" y1="21" x2="21" y2="3" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1f6ff0"/><stop offset=".5" stop-color="#7d5ccf"/><stop offset="1" stop-color="#f5920b"/></linearGradient></defs><path fill="url(#s)" d="M12 0c.7 6.3 5.7 11.3 12 12-6.3.7-11.3 5.7-12 12-.7-6.3-5.7-11.3-12-12C6.3 11.3 11.3 6.3 12 0Z"/></svg>
    <h1>Resetting Noria…</h1>
    <p id="status">Clearing the old app data…</p>
  </div>
  <script>
    (async function () {
      var s = document.getElementById('status');
      try { if ('serviceWorker' in navigator) { var rs = await navigator.serviceWorker.getRegistrations(); for (var i = 0; i < rs.length; i++) { try { await rs[i].unregister(); } catch (e) {} } } } catch (e) {}
      try { if (window.caches && caches.keys) { var ks = await caches.keys(); for (var j = 0; j < ks.length; j++) { try { await caches.delete(ks[j]); } catch (e) {} } } } catch (e) {}
      s.className = 'ok'; s.textContent = 'Done — opening the fresh Noria…';
      setTimeout(function () { location.replace('/?fresh=' + Date.now()); }, 900);
    })();
  </script>
</body>
</html>
