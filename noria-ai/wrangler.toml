name = "noria-ai"
main = "worker.js"
compatibility_date = "2024-09-23"
workers_dev = true

[ai]
binding = "AI"

[triggers]
crons = ["*/10 * * * *"]

[[kv_namespaces]]
binding = "SYNC"
id = "e8a519e217894be2a63c014c2ad36acc"

[vars]
# Image models tried in order (Cloudflare ids). If all fail, the built-in Stable Diffusion XL path runs.
IMAGE_MODELS = "@cf/black-forest-labs/flux-2-klein-9b,@cf/leonardo/lucid-origin,@cf/black-forest-labs/flux-1-schnell"

[[d1_databases]]
binding = "DB"
database_name = "noria-db"
database_id = "191ec2f5-3240-43c8-b58c-e01eb993e76d"
